<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>

<body>
    <div class="calculator">
        <div class="calculator__display"></div>
        <div class="calculator__row">
            <button type="button" class="calculator__button operator">C</button>
            <button type="button" class="calculator__button-lg operator">⌫</button>
            <button type="button" class="calculator__button operator">/</button>
        </div>
        <div class="calculator__row">
            <button type="button" class="calculator__button operand">7</button>
            <button type="button" class="calculator__button operand">8</button>
            <button type="button" class="calculator__button operand">9</button>
            <button type="button" class="calculator__button operator">*</button>
        </div>
        <div class="calculator__row">
            <button type="button" class="calculator__button operand">4</button>
            <button type="button" class="calculator__button operand">5</button>
            <button type="button" class="calculator__button operand">6</button>
            <button type="button" class="calculator__button operator">-</button>
        </div>
        <div class="calculator__row">
            <button type="button" class="calculator__button operand">1</button>
            <button type="button" class="calculator__button operand">2</button>
            <button type="button" class="calculator__button operand">3</button>
            <button type="button" class="calculator__button operator">+</button>
        </div>
        <div class="calculator__row">
            <button type="button" class="calculator__button operand">.</button>
            <button type="button" class="calculator__button-lg operand">0</button>
            <button type="button" class="calculator__button operator">=</button>
        </div>
    </div>
</body>

</html>
